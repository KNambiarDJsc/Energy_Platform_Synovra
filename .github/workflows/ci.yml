name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, types, the unit tests, and the API tests on embedded PGlite.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The same API tests against a real PostgreSQL 16, which is what a deployment runs.
  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: synovra
          POSTGRES_PASSWORD: synovra-local-only
          POSTGRES_DB: synovra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U synovra" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://synovra:synovra-local-only@localhost:5432/synovra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:server

  # The model-evaluation code: leakage guards, held-out splits, calibration.
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r ml/requirements.txt
      - run: python -I ml/tests/test_evaluation.py

  # Browser tests: every screen, keyboard use, axe accessibility checks, phone width.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The deployable stack: build both images, start database, object storage, API, web and proxy, then drive
  # them through the public address. Fails if any seam (routing, login, upload, read-back) is broken.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: docker compose -f deploy/compose.yml up -d --build
      - name: Wait for the API to be ready through the proxy
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8088/ready || true)
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          docker compose -f deploy/compose.yml ps
          docker compose -f deploy/compose.yml logs --tail=80
          exit 1
      - run: node deploy/smoke.mjs http://localhost:8088
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail=120
      - run: docker compose -f deploy/compose.yml down -v
        if: always()
